<!DOCTYPE html>
<!-- lang/dir start as Arabic (the product default) and are updated by
     I18nProvider on boot, so the first paint is already correct. -->
<html lang="ar" dir="rtl" data-theme="light" data-locale="ar">
  <head>
    <meta charset="UTF-8" />
    <!-- The app ships tablet layouts (drawer sidebar, touch targets), so the
         viewport has to scale correctly on touch POS hardware. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Defer non-critical resources - load after page is interactive -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Manifest is deferred to avoid blocking critical rendering path -->
    <script>
      // Load manifest asynchronously after page is interactive
      (function() {
        function loadManifest() {
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest.webmanifest';
          document.head.appendChild(link);
        }
        // Wait for page to be interactive before loading manifest
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            // Defer further to avoid blocking - use requestIdleCallback if available
            if (window.requestIdleCallback) {
              window.requestIdleCallback(loadManifest, { timeout: 2000 });
            } else {
              setTimeout(loadManifest, 100);
            }
          });
        } else {
          if (window.requestIdleCallback) {
            window.requestIdleCallback(loadManifest, { timeout: 2000 });
          } else {
            setTimeout(loadManifest, 100);
          }
        }
      })();
    </script>
    
    <title>Kitchen POS</title>
    <meta
      name="description"
      content="Offline-first, bilingual (Arabic/English) point-of-sale system for restaurants."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Avoid a light flash before React mounts when the stored theme is dark. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('kpos.theme') || 'light';
          var resolved =
            pref === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : pref;
          document.documentElement.dataset.theme = resolved;

          var locale = localStorage.getItem('kpos.locale') || 'ar';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.dataset.locale = locale;
        } catch (e) {
          /* Defaults in the markup already cover this. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
