appId: com.kitchenpos.app
productName: Kitchen POS
copyright: Kitchen POS

directories:
  output: dist-electron
  buildResources: assets

# Only what the packaged app actually runs. The previous config shipped all of
# `node_modules/**/*`, which pulled every devDependency — Electron, the whole
# Vite/TypeScript toolchain — into the installer.
files:
  - backend/dist/**/*
  - frontend/dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/__tests__/**'

# The migration runner reads these from `process.resourcesPath` when packaged,
# so they must ship as a resource rather than inside the asar.
extraResources:
  - from: backend/src/db/migrations
    to: migrations

# Native module: must stay unpacked so the .node binary is loadable.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  target: nsis
  icon: assets/icon.ico

mac:
  target: dmg
  icon: assets/icon.icns
  category: public.app-category.business

linux:
  target: AppImage
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Kitchen POS

# No `publish` block: there is no auto-update channel, so leaving a GitHub
# provider configured with a placeholder owner only breaks `npm run package`.
